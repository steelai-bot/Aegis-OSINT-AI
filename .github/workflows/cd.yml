name: CD - build & push

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aegis-osint-ai:latest
            ghcr.io/${{ github.repository_owner }}/aegis-osint-ai:${{ github.sha }}

  deploy-via-ssh:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Secrets are not allowed in job-level `if` - expose them as job env
    # and use a step-level condition instead (GitHub-documented workaround).
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Deploy to server via SSH
        if: ${{ env.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT || 22 }}
          script: |
            docker pull ghcr.io/${{ github.repository_owner }}/aegis-osint-ai:latest
            docker stop aegis || true
            docker rm aegis || true
            docker run -d --name aegis -p 8000:8000 \
              --env-file /home/${{ env.DEPLOY_USER }}/.aegis_env \
              ghcr.io/${{ github.repository_owner }}/aegis-osint-ai:latest
