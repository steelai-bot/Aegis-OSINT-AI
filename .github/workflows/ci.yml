name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: [3.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install .[dev] || true; fi

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type-check with mypy
        run: |
          pip install mypy
          mypy . --ignore-missing-imports || true

      - name: Run tests with coverage
        run: |
          pip install pytest pytest-cov
          if [ -d tests ]; then pytest tests/ -v --maxfail=1 --disable-warnings --cov=. --cov-report=xml --cov-report=html; else pytest -v --maxfail=1 --disable-warnings || true; fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
