<!-- Investigations list partial -->
{% if targets %}
<div class="divide-y divide-border">
    {% for target in targets %}
    <div class="p-4 hover:bg-background/50 transition-colors">
        <div class="flex items-start justify-between">
            <div class="flex-1">
                <div class="flex items-center gap-3 mb-2">
                    <h4 class="font-semibold">{{ target['query'] }}</h4>
                    <span class="px-2 py-1 text-xs rounded
                                {% if target['status'] == 'completed' %}bg-green-500/20 text-green-400
                                {% elif target['status'] == 'running' %}bg-blue-500/20 text-blue-400 animate-pulse
                                {% elif target['status'] == 'failed' %}bg-red-500/20 text-red-400
                                {% else %}bg-gray-500/20 text-gray-400{% endif %}">
                        {{ target['status'] }}
                    </span>
                </div>
                <div class="text-sm text-muted">
                    Type: {{ target['target_type'] or 'auto' }} |
                    Created: {{ target['created_at'] }}
                </div>
            </div>
            <a href="/results/{{ target['id'] }}"
               class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors text-sm flex items-center gap-2">
                <i data-lucide="eye" class="w-4 h-4"></i>
                View
            </a>
        </div>
    </div>
    {% endfor %}
</div>
<script>lucide.createIcons();</script>
{% else %}
<div class="p-8 text-center text-muted">
    <p class="mb-4">No investigations yet</p>
    <a href="/" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-colors inline-block">
        Start Your First Investigation
    </a>
</div>
{% endif %}
