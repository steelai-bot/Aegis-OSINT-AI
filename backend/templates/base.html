<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Aegis OSINT AI{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        sidebar: '#1e293b',
                        background: '#0f172a',
                        foreground: '#f1f5f9',
                        card: '#1e293b',
                        border: '#334155',
                        muted: '#64748b'
                    }
                }
            }
        }
    </script>

    <!-- HTMX for dynamic interactions -->
    <script src="https://unpkg.com/htmx.org@2.0.0"></script>

    <!-- Alpine.js for lightweight reactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.13.0/dist/cdn.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom Components CSS -->
    <link rel="stylesheet" href="/static/css/components.css">

    {% block extra_head %}{% endblock %}

    <style>
        body {
            background-color: #0f172a;
            color: #f1f5f9;
        }
    </style>
</head>
<body class="bg-background text-foreground">
    <div class="flex h-screen" x-data="{ currentPage: '{{ active_page|default('dashboard') }}' }">
        <!-- Sidebar -->
        <aside class="w-64 bg-sidebar border-r border-border flex flex-col">
            <div class="p-4 border-b border-border">
                <h1 class="text-xl font-bold">Aegis OSINT AI</h1>
                <p class="text-sm text-muted">OSINT Investigation Framework</p>
            </div>

            <nav class="flex-1 p-2">
                <a href="/"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors mb-1 {% if active_page == 'dashboard' %}bg-primary/20 text-primary{% else %}text-muted hover:bg-card hover:text-foreground{% endif %}">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard</span>
                </a>

                <a href="/investigations"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors mb-1 {% if active_page == 'investigations' %}bg-primary/20 text-primary{% else %}text-muted hover:bg-card hover:text-foreground{% endif %}">
                    <i data-lucide="search" class="w-4 h-4"></i>
                    <span>Investigations</span>
                </a>

                <a href="/plugins"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors mb-1 {% if active_page == 'plugins' %}bg-primary/20 text-primary{% else %}text-muted hover:bg-card hover:text-foreground{% endif %}">
                    <i data-lucide="puzzle" class="w-4 h-4"></i>
                    <span>Plugins</span>
                </a>

                <a href="/settings"
                   class="w-full flex items-center gap-3 px-3 py-2 rounded-md text-sm transition-colors mb-1 {% if active_page == 'settings' %}bg-primary/20 text-primary{% else %}text-muted hover:bg-card hover:text-foreground{% endif %}">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="p-4 border-t border-border">
                <div class="text-xs text-muted">v1.0.0 - Optimized</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-auto bg-background">
            <!-- Toast Container -->
            <div id="toast-container" class="toast-container"></div>

            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>

    <!-- Load modal system -->
    <script src="/static/js/modal.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
