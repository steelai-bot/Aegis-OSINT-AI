{% extends "base.html" %}

{% block title %}Plugins - Aegis OSINT AI{% endblock %}

{% block content %}
<div class="p-6">
    <!-- Header -->
    <div class="mb-6">
        <h2 class="text-3xl font-bold mb-2">OSINT Plugins</h2>
        <p class="text-muted">Available intelligence gathering plugins</p>
    </div>

    <!-- Plugins Grid -->
    <div hx-get="/api/plugins"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML"
         class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="flex items-center justify-center py-12 text-muted col-span-full">
            <svg class="animate-spin h-6 w-6 mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading plugins...
        </div>
    </div>
</div>
{% endblock %}
