services:
  aegis:
    build: .
    image: aegis-osint-ai:latest
    container_name: aegis-osint-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Named volume: initialized with image dir ownership (aegis user) -
      # avoids UID mismatch with the non-root container user on Linux hosts.
      - aegis_data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE=data/aegis.db
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  aegis_data:
