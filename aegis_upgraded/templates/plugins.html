{% extends "base.html" %}

{% block title %}Plugins Matrix - Aegis OSINT AI{% endblock %}

{% block content %}
<div class="p-8 max-w-7xl mx-auto space-y-6">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-foreground flex items-center gap-3">
                <i data-lucide="cpu" class="w-8 h-8 text-primary"></i>
                OSINT Plugins Matrix
            </h2>
            <p class="text-muted mt-1">Active discovery plugins, security scrapers, and intelligence extraction modules.</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="px-3 py-1.5 bg-card border border-border rounded-lg text-xs font-mono text-success flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-success"></span>
                HOT-RELOAD ENABLED
            </span>
        </div>
    </div>

    <!-- Plugins Grid -->
    <div hx-get="/api/plugins"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
        <div class="flex items-center justify-center py-20 text-muted font-mono text-xs">
            <svg class="animate-spin h-6 w-6 mr-3 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Discovering plugin modules...
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:afterSwap', function() {
        lucide.createIcons();
    });
</script>
{% endblock %}
